[package]
name = "unggul-axiom-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
actix-web          = "4"
actix-cors         = "0.7"
actix-web-httpauth = "0.8"
sqlx               = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
dotenvy            = "0.15"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid               = { version = "1", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
actix-multipart    = "0.7"
futures-util       = "0.3"
# ── Phase 7: Authentication Engine ──────────────────────────
jsonwebtoken       = "9"
argon2             = "0.5"
rand_core          = { version = "0.6", features = ["getrandom"] }
thiserror          = "1"
anyhow             = "1"
hex                = "0.4"
base64             = "0.22"
# ── Redis & Rate Limiting ─────────────────────────────────────
redis              = { version = "0.25", features = ["tokio-comp", "aio"] }
# ── Email Service ─────────────────────────────────────────────
lettre             = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
# ── SSE / Storage ────────────────────────────────────────────
tokio-stream       = "0.1"
async-trait        = "0.1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
